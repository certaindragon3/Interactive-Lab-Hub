<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campfire Storyboard — Iteration 02</title>
    <script>
      const pageParams = new URLSearchParams(window.location.search);
      if (pageParams.has("render")) {
        document.documentElement.classList.add("render");
      }
      if (pageParams.has("hd")) {
        document.documentElement.classList.add("hd");
      }
    </script>
    <style>
      :root {
        --paper: #f7f3ea;
        --ink: #292b2d;
        --muted: #74797b;
        --line: #c8c7c1;
        --soft: #ece9e2;
        --panel-width: calc((100% - 36px) / 3);
      }

      * { box-sizing: border-box; }

      html { background: #deddd8; }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .comic {
        width: min(100%, 1200px);
        margin: 0 auto;
        padding: 46px 48px 52px;
      }

      .story-section {
        padding: 18px 20px 20px;
        border: 2px solid transparent;
        border-radius: 12px;
      }

      .actual { border-color: #5f6263; }

      .hypothetical {
        border-color: #8c9396;
        border-style: dashed;
      }

      .section-label {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .section-label::after {
        height: 1px;
        content: "";
        background: var(--line);
        flex: 1;
      }

      .actual .section-label { color: #a94b27; }
      .hypothetical .section-label { color: #607985; }

      .panel-row {
        display: flex;
        gap: 18px;
        justify-content: flex-start;
      }

      .panel-row.centered { justify-content: center; }

      figure {
        width: var(--panel-width);
        flex: 0 0 var(--panel-width);
        margin: 0;
      }

      .frame {
        position: relative;
        overflow: hidden;
        width: 100%;
        aspect-ratio: 4 / 3;
        background: #fbf8f1;
        border: 1px solid #c8c6c0;
      }

      .frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .panel-number {
        position: absolute;
        top: 10px;
        left: 10px;
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        color: #faf8f2;
        background: #73797c;
        border-radius: 50%;
        font-size: 10px;
        font-weight: 800;
      }

      figcaption {
        min-height: 42px;
        padding-top: 8px;
      }

      figcaption strong {
        display: block;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 17px;
        line-height: 1.1;
      }

      figcaption span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.05em;
        line-height: 1.3;
        text-transform: uppercase;
      }

      .actual figure:last-child figcaption strong { color: #bd4d22; }

      .flow-arrow {
        display: grid;
        justify-items: center;
        gap: 4px;
        height: 74px;
        place-content: center;
        color: #858a8c;
      }

      .flow-arrow::before {
        width: 1px;
        height: 22px;
        content: "";
        background: #aeb0ae;
      }

      .flow-arrow svg {
        width: 26px;
        height: 26px;
        fill: currentColor;
      }

      .alternative {
        display: grid;
        height: 48px;
        place-items: center;
      }

      .alternative span {
        padding: 6px 14px;
        color: var(--muted);
        background: var(--soft);
        border-radius: 999px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 13px;
        font-style: italic;
      }

      .ending .panel-row { justify-content: center; }

      .ending .section-label { justify-content: center; }

      .ending .section-label::before,
      .ending .section-label::after {
        height: 1px;
        content: "";
        background: var(--line);
        flex: 1;
      }

      .render,
      .render body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .render .comic {
        width: 1200px;
        min-height: 1800px;
      }

      .render.hd,
      .render.hd body {
        width: 2400px;
        height: 3600px;
      }

      .render.hd .comic {
        zoom: 2;
      }

      @media (max-width: 760px) {
        :root { --panel-width: 100%; }
        .comic { padding: 24px 18px; }
        .panel-row,
        .panel-row.centered { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main class="comic">
      <section class="story-section opening" aria-label="Act one: start the fire">
        <div class="section-label">Act 1 · Ignite</div>
        <div class="panel-row">
          <figure>
            <div class="frame">
              <img src="assets/storyboard-iteration-2/01-reach-matchbox.png" alt="The person reaches for the matchbox." />
              <span class="panel-number">01</span>
            </div>
            <figcaption><strong>Get the match</strong><span>Reach</span></figcaption>
          </figure>
          <figure>
            <div class="frame">
              <img src="assets/storyboard-iteration-2/02-strike-match.png" alt="A match is struck against the box." />
              <span class="panel-number">02</span>
            </div>
            <figcaption><strong>Strike</strong><span>Friction creates a spark</span></figcaption>
          </figure>
          <figure>
            <div class="frame">
              <img src="assets/storyboard-iteration-2/03-light-kindling.png" alt="The match lights the kindling." />
              <span class="panel-number">03</span>
            </div>
            <figcaption><strong>Light the kindling</strong><span>Transfer the flame</span></figcaption>
          </figure>
        </div>
      </section>

      <div class="flow-arrow" aria-hidden="true">
        <svg viewBox="0 0 256 256"><path d="M208.49,152.49l-80,80a12,12,0,0,1-17,0l-80-80a12,12,0,0,1,17-17L108,195V32a12,12,0,0,1,24,0V195l59.51-59.52a12,12,0,0,1,17,17Z" /></svg>
      </div>

      <section class="story-section actual" aria-label="Actual scenario">
        <div class="section-label">Actual scenario · Throw the log</div>
        <div class="panel-row">
          <figure>
            <div class="frame">
              <img src="assets/storyboard-iteration-2/04a-throw-log.png" alt="The person throws a log into the fire." />
              <span class="panel-number">04</span>
            </div>
            <figcaption><strong>Throw</strong><span>0 sec</span></figcaption>
          </figure>
          <figure>
            <div class="frame">
              <img src="assets/storyboard-iteration-2/05a-flame-hop.png" alt="The flame briefly jumps upward." />
              <span class="panel-number">05</span>
            </div>
            <figcaption><strong>The flame hops</strong><span>Warning beat</span></figcaption>
          </figure>
          <figure>
            <div class="frame">
              <img src="assets/storyboard-iteration-2/06a-delayed-flare.png" alt="The fire suddenly flares orange-red." />
              <span class="panel-number">06</span>
            </div>
            <figcaption><strong>Sudden flare</strong><span>+2 sec · Retreat</span></figcaption>
          </figure>
        </div>
      </section>

      <div class="alternative"><span>or</span></div>

      <section class="story-section hypothetical" aria-label="Hypothetical scenario">
        <div class="section-label">Hypothetical scenario · Place the log</div>
        <div class="panel-row centered">
          <figure>
            <div class="frame">
              <img src="assets/storyboard-iteration-2/04b-place-log.png" alt="The person carefully places a log onto the fire." />
              <span class="panel-number">04B</span>
            </div>
            <figcaption><strong>Place it slowly</strong><span>Controlled contact</span></figcaption>
          </figure>
          <figure>
            <div class="frame">
              <img src="assets/storyboard-iteration-2/05b-stable-stay.png" alt="The person remains beside a stable fire." />
              <span class="panel-number">05B</span>
            </div>
            <figcaption><strong>Stay close</strong><span>Stable response</span></figcaption>
          </figure>
        </div>
      </section>

      <div class="flow-arrow" aria-hidden="true">
        <svg viewBox="0 0 256 256"><path d="M208.49,152.49l-80,80a12,12,0,0,1-17,0l-80-80a12,12,0,0,1,17-17L108,195V32a12,12,0,0,1,24,0V195l59.51-59.52a12,12,0,0,1,17,17Z" /></svg>
      </div>

      <section class="story-section ending" aria-label="Ending">
        <div class="section-label">Ending</div>
        <div class="panel-row">
          <figure>
            <div class="frame">
              <img src="assets/storyboard/scene-4-dawn.png" alt="The person watches the embers as night ends." />
              <span class="panel-number">07</span>
            </div>
            <figcaption><strong>Watch until dawn</strong><span>The fire fades</span></figcaption>
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
