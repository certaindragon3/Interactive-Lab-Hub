<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You care. I clean.</title>
  <style>
    :root { --paper:#f7f3ea; --ink:#292b2d; --muted:#74797b; --line:#c8c7c1; }
    * { box-sizing:border-box; }
    body { margin:0; background:#deddd8; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    .tools { max-width:1280px; margin:auto; padding:14px 48px; display:flex; justify-content:flex-end; }
    .tools a { color:#616769; font-size:12px; text-underline-offset:3px; }
    .tools a:focus-visible { outline:2px solid #367e78; outline-offset:4px; }
    .page { width:1280px; max-width:100%; margin:auto; padding:46px 48px 50px; background:var(--paper); }
    h1 { margin:0 0 12px; font:700 32px/1 Georgia,"Times New Roman",serif; letter-spacing:-.025em; }
    .route + .route { margin-top:50px; }
    h2 { display:flex; align-items:center; gap:14px; margin:0 0 18px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    h2::after { content:""; flex:1; height:1px; background:var(--line); }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:29px 18px; }
    figure { margin:0; min-width:0; }
    .frame { position:relative; width:100%; aspect-ratio:4/3; background:var(--paper); border:1px solid var(--line); overflow:hidden; }
    img { width:100%; height:100%; display:block; object-fit:contain; }
    .number { position:absolute; top:10px; left:10px; width:28px; height:28px; display:grid; place-items:center; border-radius:50%; background:#73797c; color:#faf8f2; font-size:10px; font-weight:700; }
    figcaption { padding-top:8px; }
    figcaption strong { display:block; font:700 18px/1.15 Georgia,"Times New Roman",serif; }
    figcaption span { display:block; margin-top:4px; color:var(--muted); font-size:10px; line-height:1.4; letter-spacing:.06em; text-transform:uppercase; }
    .done figcaption strong { color:#ad5e3c; }
    .rhythm { display:flex; justify-content:space-between; align-items:center; gap:40px; border-top:1px solid var(--line); margin-top:38px; padding-top:20px; }
    .rhythm p { margin:0; display:flex; gap:28px; color:var(--muted); font-size:10px; letter-spacing:.06em; text-transform:uppercase; line-height:1.6; }
    .rhythm p span { display:block; }
    .rhythm b { display:block; font-weight:700; }
    .wave { display:flex; align-items:center; gap:18px; color:var(--muted); }
    .wave-label { font:italic 13px Georgia,"Times New Roman",serif; white-space:nowrap; }
    .wave svg { width:260px; height:60px; overflow:visible; }
    .wave path,.wave line { stroke:#8b908f; stroke-width:1.2; fill:none; }
    .wave text { fill:var(--muted); font:9px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:.02em; }
    @media (max-width:760px) { .page { padding:28px 20px; } .tools { padding:14px 20px; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } .rhythm { flex-direction:column; align-items:flex-start; gap:20px; } }
    @media (max-width:460px) { .grid { grid-template-columns:1fr; } h2 { font-size:10px; letter-spacing:.1em; } .wave { flex-direction:column; align-items:flex-start; gap:8px; } .rhythm p { gap:20px; } }
    @media print { .tools { display:none; } body { background:var(--paper); } figure { break-inside:avoid; } }
    .subtitle { margin:0 0 30px; font-size:13px; color:var(--muted); }
    figcaption strong { font-size:19px; line-height:1.25; }
    figcaption span { font-size:12px; line-height:1.45; letter-spacing:0; text-transform:none; }
    .grid { row-gap:30px; }
  </style>
</head>
<body>
  <nav class="tools" aria-label="Download"><a href="storyboard-cat-cleanup-render.png" download>Download PNG</a></nav>
  <main class="page" id="storyboard">
    <h1>You care. I clean.</h1>
    <p class="subtitle">A home-cleaning robot · A cat-owner scenario</p>
<section class="route" aria-label="Six moments in a cat cleanup scenario">
<div class="grid">
    <figure>
      <div class="frame">
        <img src="assets/storyboard-cat-cleanup/01-notice.png" alt="A worried stick-figure owner looks at a cat crouched beside a small floor spill.">
        <span class="number">01</span>
      </div>
      <figcaption><strong>Oh no, a mess.</strong><span>The cat has thrown up. Its owner notices.</span></figcaption>
    </figure>
    <figure>
      <div class="frame">
        <img src="assets/storyboard-cat-cleanup/02-call-for-help.png" alt="The owner holds the cat in one arm and points to the spill while asking the robot for help.">
        <span class="number">02</span>
      </div>
      <figcaption><strong>“Clean this, please.”</strong><span>Hold the cat away and point out the spot.</span></figcaption>
    </figure>
    <figure>
      <div class="frame">
        <img src="assets/storyboard-cat-cleanup/03-detect-wet-mess.png" alt="The robot scans the spill from its edge, with all wheels on clean floor.">
        <span class="number">03</span>
      </div>
      <figcaption><strong>A wet mess. Stop here.</strong><span>The robot detects the spill and stays outside it.</span></figcaption>
    </figure>
    <figure>
      <div class="frame">
        <img src="assets/storyboard-cat-cleanup/04-scoop-and-seal.png" alt="A single robot arm lifts solid material with a scoop beside an open waste hatch.">
        <span class="number">04</span>
      </div>
      <figcaption><strong>Scoop, then seal.</strong><span>Lift the mess into a sealed waste compartment.</span></figcaption>
    </figure>
    <figure>
      <div class="frame">
        <img src="assets/storyboard-cat-cleanup/05-wash-and-dry.png" alt="The robot uses a flat cleaning head; damp floor ahead becomes clean and dry behind.">
        <span class="number">05</span>
      </div>
      <figcaption><strong>Wash. Recover. Dry.</strong><span>Wipe the residue and recover the dirty liquid.</span></figcaption>
    </figure>
    <figure>
      <div class="frame">
        <img src="assets/storyboard-cat-cleanup/06-back-together.png" alt="The owner sits with the cat on a sofa while the robot shows a green completion light.">
        <span class="number">06</span>
      </div>
      <figcaption><strong>More time for the cat.</strong><span>The floor is clean. The owner stays with the cat.</span></figcaption>
    </figure>
</div>
</section>

  </main>
</body>
</html>
